title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Anyone may propose ideas here for public consideration, including ideas drafted with AI assistance; the person who posts a proposal is responsible for it. This provides proposal access, not organizational decision authority. Search existing Organization Discussions and affected-repository issues before submitting. A proposal is not authorization to implement and does not guarantee incorporation. Only human maintainers decide whether and how it proceeds; they may accept, defer, decline, combine, or adapt it at their discretion. They may also close, lock, or hide a proposal without responding, including duplicates, off-topic posts, and bulk-generated or low-effort submissions.

        Do not include credentials, approval codes, private paths, personal information, private repository content, exploit details, or other sensitive material. Use the affected repository's private security process instead.
  - type: textarea
    id: disclosure
    attributes:
      label: Proposal disclosure
      description: If AI assisted, paste the exact notice below and keep it as the first field. If entirely human-authored, enter "Human-authored proposal."
      placeholder: |
        > **AI-assisted proposal — awaiting maintainer decision:** This discussion was
        > prepared with AI assistance. The person who posted it is responsible for its
        > content, and it remains a proposal until a maintainer records a decision.
    validations:
      required: true
  - type: input
    id: affected-projects
    attributes:
      label: Affected repositories and versions
      description: Name every affected AsiBackbone repository and version, or explain why no version applies.
    validations:
      required: true
  - type: textarea
    id: problem-goal
    attributes:
      label: Problem or goal
      description: Describe the need, intended outcome, and who benefits.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, prior work, and existing items
      description: Link relevant documentation, Discussions, issues, or other public evidence and explain what your duplicate search found.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Describe reasonable alternatives, including retaining the current behavior, and their tradeoffs.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Identify compatibility, security, maintenance, documentation, or adoption risks.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision requested
      description: State the specific maintainer decision or guidance requested. Do not present the proposal as approved work.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Proposal checks
      options:
        - label: I searched existing Organization Discussions and affected-repository issues and found no equivalent proposal.
          required: true
        - label: I understand that maintainers may accept, defer, decline, combine, or adapt this proposal at their discretion.
          required: true
        - label: I understand that only a maintainer may authorize a downstream issue or other governed work item.
          required: true
        - label: I have not included sensitive or private information.
          required: true
