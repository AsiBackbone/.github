name: Assurance map validation

# Checks that every enforcement point, test, and document linked from
# assurance/control-ownership.json exists at its resolved ref: the reviewed
# release tag for product links, or main for repository-host links. It reads
# public files only. The offline manifest, coverage, baseline, and rendering
# checks run in the required Validate organization profile check; this workflow
# adds the network-dependent link check on map pull requests and every week, so
# a moved or deleted file in an owning repository surfaces here as drift.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'assurance/**'
      - 'compatibility/**'
      - 'scripts/Test-AssuranceMap.ps1'
      - '.github/workflows/assurance-map-validation.yml'
  schedule:
    # Mondays at 13:47 UTC (08:47 America/Chicago during daylight saving time).
    - cron: '47 13 * * 1'

permissions:
  contents: read

concurrency:
  group: assurance-map-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify assurance map references
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify assurance map references
        shell: pwsh
        env:
          # Read-only token used only to raise the GitHub API rate limit for public files.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Test-AssuranceMap.ps1 -VerifyReferences
