name: Documentation ownership review

# Checks that every guide and canonical document linked from
# documentation/ownership.json exists on its repository's main branch, and
# scans each surface's first-contact pages for current-version claims about
# other projects that disagree with compatibility/ecosystem-compatibility.json.
# It reads public files only. The offline manifest and rendering checks run in
# the required Validate organization profile check; this workflow runs on map
# pull requests and every week, and reports drift for the owning repository to
# fix.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'documentation/**'
      - 'scripts/Test-DocumentationOwnership.ps1'
      - '.github/workflows/documentation-ownership-review.yml'
  schedule:
    # Mondays at 13:57 UTC (08:57 America/Chicago during daylight saving time).
    - cron: '57 13 * * 1'

permissions:
  contents: read

concurrency:
  group: documentation-ownership-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review documentation ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review documentation ownership
        shell: pwsh
        env:
          # Read-only token used only to raise the GitHub API rate limit for public files.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Test-DocumentationOwnership.ps1 -VerifyReferences -ScanVersionClaims
