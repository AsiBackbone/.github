name: EditorConfig baseline validation

# Checks that the shared part of every AsiBackbone .NET repository's
# .editorconfig still matches the NetCoreApplicationTemplate reference copy
# (EDITORCONFIG-BASELINE.md). It reads public files only. The offline self-test
# runs in the required Validate organization profile check; this workflow adds
# the network-dependent comparison on pull requests that change it and every
# week, so drift in a sibling repository surfaces here.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'EDITORCONFIG-BASELINE.md'
      - 'scripts/Test-EditorConfigBaseline.ps1'
      - '.github/workflows/editorconfig-baseline-validation.yml'
  schedule:
    # Mondays at 13:52 UTC (08:52 America/Chicago during daylight saving time).
    - cron: '52 13 * * 1'

permissions:
  contents: read

concurrency:
  group: editorconfig-baseline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify shared EditorConfig rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify shared EditorConfig rules
        shell: pwsh
        run: ./scripts/Test-EditorConfigBaseline.ps1
