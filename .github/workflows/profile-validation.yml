name: Organization profile validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate organization profile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate profile content
        shell: pwsh
        run: ./scripts/Test-OrganizationProfile.ps1

      - name: Test published-site validator
        shell: pwsh
        run: ./scripts/Test-PublishedSites.ps1 -SelfTest
