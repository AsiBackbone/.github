name: Published documentation sites validation

# Checks the deployed Learning, AsiBackbone, .NET Core Application Template, and
# Reference Application DocFX sites against LANDING-PAGE-STANDARD.md. The sites
# are built and deployed by their own repositories, so this is a scheduled drift
# check rather than a required pull-request check. Fix findings in the
# repository named in the job summary.

on:
  workflow_dispatch:
  schedule:
    # Mondays at 13:17 UTC (08:17 America/Chicago during daylight saving time).
    - cron: '17 13 * * 1'

permissions:
  contents: read

concurrency:
  group: published-sites-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate published documentation sites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate published sites
        shell: pwsh
        run: ./scripts/Test-PublishedSites.ps1
